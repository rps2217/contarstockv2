
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>LogiCount Pro - Mobile First</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
      
      :root {
        --safe-area-inset-top: env(safe-area-inset-top);
        --safe-area-inset-bottom: env(safe-area-inset-bottom);
        --nav-height: 6rem;
      }

      body { 
        overscroll-behavior-y: contain; 
        touch-action: manipulation; 
        font-family: 'Inter', sans-serif;
        font-size: 16px;
        min-height: 100dvh;
        width: 100vw;
        overflow-x: hidden;
      }

      /* --- MOTOR DE TEMAS LOGICOUNT --- */
      
      /* 1. TEMA WARM (Sepia) */
      .theme-warm { background-color: #fff7ed !important; }
      .theme-warm .bg-white { background-color: #fffbeb !important; }
      .theme-warm .bg-slate-50 { background-color: #fff7ed !important; }
      .theme-warm .text-slate-900 { color: #431407 !important; }
      
      /* 2. TEMA NAVY (Azul Profundo) */
      .theme-navy { background-color: #020617 !important; }
      .theme-navy .bg-white { background-color: #0f172a !important; border-color: #1e293b !important; }
      .theme-navy .bg-slate-50 { background-color: #020617 !important; }
      .theme-navy .text-slate-900, .theme-navy .text-slate-800 { color: #f1f5f9 !important; }
      .theme-navy .border-slate-200 { border-color: #1e293b !important; }

      /* 3. TEMA CONTRAST (Accesibilidad) */
      .theme-contrast { background-color: #000000 !important; }
      .theme-contrast .bg-white, .theme-contrast .bg-slate-50 { background-color: #000000 !important; border: 2px solid #facc15 !important; }
      .theme-contrast .text-slate-900, .theme-contrast .text-slate-600 { color: #ffffff !important; }
      .theme-contrast .text-blue-600 { color: #facc15 !important; }
      .theme-contrast button { border: 2px solid #ffffff !important; }

      /* 4. TEMA OLED (Negro Puro) */
      .theme-oled { background-color: #000000 !important; }
      .theme-oled .bg-white { background-color: #000000 !important; border-color: #262626 !important; }
      .theme-oled .bg-slate-50 { background-color: #000000 !important; }
      .theme-oled .text-slate-900 { color: #ffffff !important; }

      /* Helper para forzar Dark Mode en Tailwind cuando se usan temas oscuros */
      .dark .text-slate-400 { color: #94a3b8 !important; }
      .dark .bg-slate-100 { background-color: #1e293b !important; }

      /* Animaciones */
      .page-transition {
        animation: slideUp 0.3s ease-out forwards;
        will-change: transform, opacity;
      }

      @keyframes slideUp {
        from { transform: translateY(15px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }

      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
<script type="importmap">
