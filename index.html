<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0a0f1d" />
    <meta name="description" content="LogiCount Pro - Accesibilidad Visual" />
    <title>LogiCount Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
      
      :root {
        --bg-zen: #0a0f1d;
        --text-comfort: #e2e8f0; /* Blanco crema, no deslumbra */
      }

      body { 
        overscroll-behavior-y: contain; 
        touch-action: manipulation; 
        -webkit-text-size-adjust: 100%;
        background-color: var(--bg-zen);
        color: var(--text-comfort);
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-size: 18px; /* Aumento de base para fatiga visual */
        line-height: 1.6;
      }

      .zen-bg {
        background: radial-gradient(circle at 50% -20%, #161e2e 0%, #0a0f1d 80%);
        min-height: 100vh;
      }

      /* Estilo para items que requieren lectura rápida (SKUs) */
      .sku-font {
        font-family: 'ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', monospace;
        letter-spacing: 0.05em;
        font-weight: 800;
      }

      /* Scrollbars suaves para no distraer */
      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background: #0a0f1d; }
      ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }

      .glass-card {
        background: rgba(30, 41, 59, 0.6);
        backdrop-filter: blur(12px);
        border: 2px solid rgba(255, 255, 255, 0.05); /* Bordes más gruesos para definición */
        box-shadow: 0 15px 35px -5px rgba(0,0,0,0.6);
      }
    </style>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",

    "react-router-dom": "https://esm.sh/react-router-dom@6.22.3?external=react,react-dom",
    "@remix-run/router": "https://esm.sh/@remix-run/router@1.15.3",

    "lucide-react": "https://esm.sh/lucide-react@0.344.0?external=react",
    "recharts": "https://esm.sh/recharts@2.12.2?external=react,react-dom",
    "dexie": "https://esm.sh/dexie@3.2.4",
    "dexie-react-hooks": "https://esm.sh/dexie-react-hooks@1.1.7?external=react,dexie",
    "uuid": "https://esm.sh/uuid@9.0.1",

    "react-virtualized-auto-sizer": "https://esm.sh/react-virtualized-auto-sizer@1.0.24?external=react,react-dom",
    "html5-qrcode": "https://esm.sh/html5-qrcode@2.3.8",
    "date-fns": "https://esm.sh/date-fns@3.3.1",

}

</head>
<body class="zen-bg">
    <div id="root"></div>

</html>
