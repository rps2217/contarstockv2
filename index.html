
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>LogiCount Pro - Enterprise Core</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              mono: ['JetBrains Mono', 'monospace'],
            }
          }
        }
      }
    </script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap');
      @import url('https://fonts.googleapis.com/css2?family=Libre+Barcode+128&display=swap');
      
      :root {
        --safe-area-inset-top: env(safe-area-inset-top);
        --safe-area-inset-bottom: env(safe-area-inset-bottom);
      }

      body { 
        overscroll-behavior-y: none;
        touch-action: manipulation;
        font-family: 'JetBrains Mono', monospace;
        background-color: #020617;
        margin: 0;
        padding: 0;
        color: #f8fafc; /* Increased contrast */
        font-size: 16px; /* Improved readability */
        -webkit-user-select: none;
        user-select: none;
      }

      #root { height: 100dvh; width: 100vw; display: flex; flex-direction: column; overflow: hidden; }
      .no-scrollbar::-webkit-scrollbar { display: none; }

      @keyframes scan-line {
        0% { transform: translateY(-150px); opacity: 0; }
        50% { opacity: 1; }
        100% { transform: translateY(150px); opacity: 0; }
      }
      .animate-scan-line {
        animation: scan-line 2s ease-in-out infinite;
      }

      @keyframes shake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-5px); }
        75% { transform: translateX(5px); }
      }
      .animate-in.shake {
        animation: shake 0.2s ease-in-out 3;
      }

      @keyframes flash-out {
        0% { opacity: 1; }
        100% { opacity: 0; }
      }
      .animate-flash-out {
        animation: flash-out 0.5s ease-out forwards;
      }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
</body>
</html>
