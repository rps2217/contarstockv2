name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  pr-checks:
    name: Validate PR
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run tests
        run: npm run test:run
        env:
          CI: true

      - name: Build
        run: npm run build
        env:
          CI: false

  comment-coverage:
    name: Post Coverage Comment
    runs-on: ubuntu-latest
    needs: pr-checks
    if: always()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run coverage
        run: npm run test:coverage
        env:
          CI: true

      - name: Generate coverage summary
        run: |
          npx coverage-to-comment \
            --coverage-path coverage/lcov.info \
            --github-token ${{ secrets.GITHUB_TOKEN }}

      - name: Post comment
        uses: rommonz/react-pull-request-action@master
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          message: |
            ## Test Coverage Report
            
            | Metric | Value |
            |--------|-------|
            | Statements | ${{ steps.coverage.outputs.statements }}% |
            | Branches | ${{ steps.coverage.outputs.branches }}% |
            | Functions | ${{ steps.coverage.outputs.functions }}% |
            | Lines | ${{ steps.coverage.outputs.lines }}% |
