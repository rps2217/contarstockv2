
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>LogiCount Pro - Enterprise Core</title>
    
    <!-- Performance: Preconnect a Google Fonts (reducir DNS lookup) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Performance: Preload chunks críticos para primer render -->
    <link rel="modulepreload" href="/assets/vendor-react.module.js" />
    <link rel="modulepreload" href="/assets/vendor-ui.module.js" />
    <link rel="modulepreload" href="/assets/AppShell.module.js" />
    
    <!-- Performance: Fonts con display=swap para no bloquear render -->
    <!-- DM Sans: Fuente principal de la UI -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <!-- JetBrains Mono: Fuente para código/barras -->
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <!-- Inter: Solo si es necesaria explícitamente (lazy load) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <!-- Libre Barcode 128: Carga diferida solo cuando se necesita -->
    
    <!-- Fallback: System fonts mientras cargan las fuentes web -->
    <style>
        /* Font loading optimization - Evita FOIT (Flash of Invisible Text) */
        body {
            font-family: "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        code, pre, .font-mono, .barcode {
            font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, monospace;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
</body>
</html>
