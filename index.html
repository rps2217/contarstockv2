<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>LogiCount Pro - Mobile First</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
      
      :root {
        --safe-area-inset-top: env(safe-area-inset-top);
        --safe-area-inset-bottom: env(safe-area-inset-bottom);
        --nav-height: 6rem;
      }

      body { 
        overscroll-behavior-y: contain; 
        touch-action: manipulation; 
        background-color: #f8fafc;
        color: #0f172a;
        font-family: 'Inter', sans-serif;
        font-size: 16px;
        min-height: 100dvh;
        width: 100vw;
        overflow-x: hidden;
      }

      /* Scrollbars invisibles pero funcionales */
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

      /* Animaciones de entrada suaves optimizadas para GPU móvil */
      .page-transition {
        animation: slideUp 0.3s ease-out forwards;
        will-change: transform, opacity;
      }

      @keyframes slideUp {
        from { transform: translateY(15px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }

      /* Efectos de éxito en ráfaga */
      .scan-success-glow {
        position: absolute;
        inset: 0;
        z-index: 5;
        background: radial-gradient(circle at center, rgba(34, 197, 94, 0.15) 0%, transparent 70%);
        pointer-events: none;
        animation: pulseFade 0.4s ease-out forwards;
      }

      @keyframes pulseFade {
        0% { opacity: 0; transform: scale(0.8); }
        50% { opacity: 1; transform: scale(1); }
        100% { opacity: 0; transform: scale(1.1); }
      }
    </style>
