
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>LogiCount Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
      
      :root {
        --safe-area-inset-top: env(safe-area-inset-top);
        --safe-area-inset-bottom: env(safe-area-inset-bottom);
      }

      * {
        -webkit-tap-highlight-color: transparent;
        outline: none !important;
      }

      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      
      body { 
        overscroll-behavior-y: contain; 
        touch-action: manipulation; 
        -webkit-text-size-adjust: 100%;
        background-color: #020617;
        color: #f8fafc;
        font-family: 'Inter', sans-serif;
      }

      .ios-safe-pb { padding-bottom: var(--safe-area-inset-bottom); }

      /* Animación de pulso para escaneo exitoso */
      @keyframes scanPulse {
        0% { transform: scale(0.95); opacity: 0; }
        50% { opacity: 1; }
        100% { transform: scale(1.1); opacity: 0; }
      }
      .scan-success-glow {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle, rgba(34, 197, 94, 0.2) 0%, transparent 70%);
        animation: scanPulse 0.5s ease-out forwards;
        pointer-events: none;
        z-index: 5;
      }

      /* Vidrio Esmerilado */
      .glass-card {
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }

      /* Efecto de presión en botones */
      .btn-press:active { transform: scale(0.92); filter: brightness(1.1); }

      @keyframes slideInUp {
        from { transform: translateY(20px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }
      .animate-flow { animation: slideInUp 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
    </style>
