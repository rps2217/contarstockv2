
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>LogiCount Pro - Rugged Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap');
      /* Fuente para generar códigos de barras reales desde texto */
      @import url('https://fonts.googleapis.com/css2?family=Libre+Barcode+128&display=swap');
      
      :root {
        --safe-area-inset-top: env(safe-area-inset-top);
        --safe-area-inset-bottom: env(safe-area-inset-bottom);
        --color-industrial-blue: #3b82f6;
        --color-industrial-bg: #020617;
      }

      body { 
        overscroll-behavior-y: none;
        touch-action: manipulation;
        font-family: 'JetBrains Mono', monospace;
        background-color: var(--color-industrial-bg);
        background-image: 
            radial-gradient(circle at 2px 2px, rgba(255,255,255,0.03) 1px, transparent 0);
        background-size: 24px 24px;
        margin: 0;
        padding: 0;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        color: #f1f5f9;
      }

      #root {
        height: 100dvh;
        width: 100vw;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .barcode-font {
        font-family: 'Libre Barcode 128', cursive;
      }

      /* Animación de escaneo láser HUD */
      @keyframes radar-pulse {
        0% { transform: scale(1); opacity: 0.5; }
        100% { transform: scale(1.1); opacity: 0; }
      }

      .led-active {
        box-shadow: 0 0 8px currentColor;
        animation: led-blink 1.5s infinite;
      }

      @keyframes led-blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.4; }
      }

      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      
      * { box-shadow: none !important; }
      
      input, textarea {
        -webkit-user-select: text;
        user-select: text;
      }

      .flash-active {
        animation: flash-step 0.15s steps(2);
      }
      @keyframes flash-step {
        0% { background-color: transparent; }
        50% { background-color: rgba(59, 130, 246, 0.4); }
        100% { background-color: transparent; }
      }
    </style>
